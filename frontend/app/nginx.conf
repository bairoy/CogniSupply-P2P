server {
    # Matches the Vite dev port so http://localhost:5173 is the address in
    # every mode -- see the Dockerfile's EXPOSE comment.
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URL space. /control-tower, /track/TRL-1001 and the
    # rest exist only in the bundle, so any path that is not a real file has to
    # fall through to index.html or a page refresh returns nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under /assets, so the filename changes
    # whenever the content does and a long cache can never serve a stale build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file with a stable name; caching it would pin
    # clients to an old bundle after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
